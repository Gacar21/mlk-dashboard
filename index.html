<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/mlk-dashboard/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="mlk_dashboard">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>mlk_dashboard</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/5.3.4/mqtt.min.js"></script>
  <script>
window.mqttBridge = {
  client: null,
  onMessage: null,
  onConnect: null,
  onDisconnect: null,
  onError: null,

  connect: function(broker, port, user, pass, clientId) {
    if (this.client) { this.client.end(true); this.client = null; }
    var url = 'wss://' + broker + ':' + port + '/mqtt';
    this.client = mqtt.connect(url, {
      username: user,
      password: pass,
      clientId: clientId,
      protocolVersion: 4,
      reconnectPeriod: 0,
      connectTimeout: 8000
    });
    var self = this;
    this.client.on('connect', function() {
      ['sensors/temp','sensors/hum','sensors/pot/adc','sensors/pot/angulo','sensors/pot/voltaje','sensors/peso']
        .forEach(function(t) { self.client.subscribe(t); });
      if (self.onConnect) self.onConnect();
    });
    this.client.on('close',   function() { if (self.onDisconnect) self.onDisconnect(); });
    this.client.on('error',   function(e){ if (self.onError)      self.onError(e.message || e.toString()); });
    this.client.on('message', function(topic, payload) {
      if (self.onMessage) self.onMessage(topic, payload.toString());
    });
  },

  disconnect: function() {
    if (this.client) { this.client.end(true); this.client = null; }
  }
};
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
